# Premier fait de chaque exemple, selon le genre du streamer.
streamer_intro:
  m: "Le streamer s'appelle {streamer}."
  f: "La streameuse s'appelle {streamer}."

# Groupes exclusifs : au plus un fait par groupe (sinon ils se contredisent).
exclusive_facts:
  schedule:
    - "Le stream a lieu le mardi, le jeudi et le dimanche à partir de 21h."
    - "Le stream a lieu tous les soirs de semaine à partir de 19h."
    - "Le stream a lieu le week-end, de 14h à 18h."
    - "Le stream a lieu le lundi et le jeudi à partir de 20h."
    - "Le stream a lieu le mercredi et le samedi à partir de 21h30."
  setup:
    - "Config de {streamer} : RTX 3070, 16 Go de RAM, Ryzen 5 5600X."
    - "Config de {streamer} : RX 7800 XT, 32 Go de RAM, Ryzen 7 7700."
    - "{streamer} streame depuis un MacBook Pro M3."
    - "Config de {streamer} : RTX 4090, 64 Go de RAM, Intel Core i9."
  favorite_games:
    - "Jeux préférés de {streamer} : Zelda Breath of the Wild, Hades, Slay the Spire."
    - "Jeux préférés de {streamer} : Minecraft, Terraria, Factorio."
    - "Jeux préférés de {streamer} : Final Fantasy IX, Chrono Trigger, Persona 5."
    - "Jeux préférés de {streamer} : Rocket League, Valorant, Fall Guys."
  next_game:
    - "Prochain jeu prévu : Baldur's Gate 3."
    - "Prochain jeu prévu : Disco Elysium."
    - "Prochain jeu prévu : Stardew Valley en coop avec le chat."
    - "Prochain jeu prévu : Resident Evil 4 Remake."
  creation:
    - "La chaîne a été créée en 2019."
    - "La chaîne a été créée en 2023."
    - "La chaîne a été créée en 2017, d'abord sur YouTube."
  goal:
    - "Objectif du mois : 2 000 followers."
    - "Objectif du mois : 50 abonnés."
    - "Objectif du mois : finir le jeu en cours sans guide."

