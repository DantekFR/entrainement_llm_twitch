# Catégories du live. Genres : libellés IGDB. Descriptions : ~80 % en anglais (comme IGDB).
categories:
  games_with_card:
    - name: Minecraft
      genres: [Simulator, Adventure]
      description: "A sandbox game about placing blocks and going on adventures: explore randomly generated worlds, gather resources and build anything you can imagine."
    - name: Slay the Spire
      genres: [Card & Board Game, Strategy, Indie]
      description: "A roguelike deck-building game where you craft a unique deck, encounter strange creatures and climb the Spire."
    - name: Factorio
      genres: [Simulator, Strategy, Indie]
      description: "Build and maintain ever-growing factories on an alien planet, automating mining, production and logistics."
    - name: "The Legend of Zelda: Breath of the Wild"
      genres: [Adventure, Role-playing (RPG)]
      description: "Link wakes up after a hundred years of slumber and explores the open kingdom of Hyrule to defeat Calamity Ganon."
    - name: Terraria
      genres: [Platform, Adventure, Indie]
      description: "A 2D sandbox adventure: dig, fight, explore and build in a procedurally generated world."
    - name: Rocket League
      genres: [Sport, Racing]
      description: "Soccer meets driving: rocket-powered cars hit a giant ball to score goals."
    - name: Baldur's Gate 3
      genres: [Role-playing (RPG), Turn-based strategy (TBS), Adventure]
      description: "A party-based RPG set in the Forgotten Realms, where a mind flayer parasite threatens to transform you."
    - name: Valorant
      genres: [Shooter, Tactical]
      description: "A 5v5 tactical shooter where agents with unique abilities fight to plant or defuse the Spike."
    - name: Disco Elysium
      genres: [Role-playing (RPG), Adventure, Indie]
      description: "A detective RPG where an amnesiac cop investigates a murder in the city of Revachol, through dialogue and skill checks."
    - name: Portal 2
      genres: [Puzzle, Platform]
      description: "A first-person puzzle game where you solve test chambers with a portal gun, under the eye of the AI GLaDOS."
    - name: Super Mario Odyssey
      genres: [Platform, Adventure]
      description: "Mario travels across kingdoms aboard the Odyssey with Cappy, his living hat, to rescue Princess Peach from Bowser."
    - name: Among Us
      genres: [Strategy, Indie]
      description: "Crewmates complete tasks on a spaceship while impostors secretly sabotage and eliminate them."
    - name: "Animal Crossing: New Horizons"
      genres: [Simulator]
      description: "Move to a deserted island, gather resources, craft tools and build a community with animal villagers."
    - name: Cyberpunk 2077
      genres: [Role-playing (RPG), Shooter, Adventure]
      description: "An open-world RPG set in Night City, where the mercenary V chases an implant that holds the key to immortality."
    # Fiches réécrites en français dans la config du bot (~20 %).
    - name: Mario Kart 8 Deluxe
      genres: [Racing, Arcade]
      description: "Jeu de course où les personnages de Nintendo s'affrontent sur des circuits remplis d'objets et de pièges."
    - name: "Clair Obscur: Expedition 33"
      genres: [Role-playing (RPG), Turn-based strategy (TBS), Adventure]
      description: "Un RPG au tour par tour où une expédition part affronter la Peintresse, qui chaque année efface tous ceux qui ont l'âge du nombre qu'elle peint."
    - name: Rayman Legends
      genres: [Platform, Adventure]
      description: "Jeu de plateforme où Rayman et ses amis traversent des mondes enchantés pour libérer les Ptizêtres."
    - name: Dofus
      genres: [Role-playing (RPG), Tactical, Turn-based strategy (TBS)]
      description: "Jeu de rôle en ligne massivement multijoueur, aux combats tactiques au tour par tour, dans le Monde des Douze."

  # Jeux inventés : le modèle ne peut s'appuyer que sur la fiche.
  invented_with_card:
    - name: Ferrous Hollow
      genres: [Platform, Adventure, Indie]
      description: "A metroidvania set inside a rusting giant robot, where you play a tiny mechanic repairing it from the inside."
    - name: Orbital Ramen
      genres: [Simulator, Arcade, Indie]
      description: "Run a noodle stand on a space station and serve picky aliens before their shuttle leaves."
    - name: Kingdom of Ash and Echo
      genres: [Role-playing (RPG), Tactical]
      description: "A tactical RPG where every fallen soldier comes back as an echo fighting for the other side."
    - name: Turbo Taupe
      genres: [Racing, Arcade, Indie]
      description: "A kart racer where moles dig tunnels under the track to take shortcuts."
    - name: Brume et Racines
      genres: [Simulator, Indie]
      description: "Un jeu de gestion où l'on tient une herboristerie dans un village perdu dans la brume."
    - name: Sous la Glace
      genres: [Adventure, Puzzle, Indie]
      description: "Une aventure narrative où une plongeuse explore une station scientifique abandonnée sous la banquise."

  # Pas de fiche IGDB (jeu trop récent ou trop confidentiel) : juste le nom.
  games_without_card:
    - Petit Jardin Cosmique
    - NEON RIFT
    - Moth Lantern
    - Les Chroniques de Bidonville

  # Catégories Twitch non gaming : jamais de fiche. Autorisées même si l'évaluation les utilise.
  non_gaming:
    - Just Chatting
    - IRL
    - Software and Game Development
    - Music
    - Art
    - Makers & Crafting
    - Food & Drink
    - Talk Shows & Podcasts
    - Science & Technology
    - Retro

# Titres de live. {category} est remplacé par la catégorie en cours.
titles:
  - "{category} : on continue l'aventure !"
  - "Découverte de {category}"
  - "On termine {category} ce soir"
  - "{category} avec le chat"
  - "{category} en chill"
  - "Premier live sur {category}"
  - "Soirée tranquille, venez papoter"
  - "Live du soir !"
  - "On teste des trucs, venez voir"
  - "Retour après une semaine de pause"
  - "Live spécial 1 an de la chaîne"
  - "!planning pour les prochains lives"
